<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmeira Didática</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f5;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            border-top: 8px solid #2e7d32;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .content-box {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 25px;
            min-height: 80px;
        }

        .badge {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 2px solid #2e7d32;
            cursor: pointer;
        }

        /* Botões Principais (Verdes) */
        .btn-main {
            background-color: #2e7d32;
            color: white;
        }

        .btn-main:hover {
            background-color: #1b5e20;
            border-color: #1b5e20;
        }

        /* Novo Botão de Voltar (Vazado/Secundário) */
        .btn-back {
            background-color: transparent;
            color: #2e7d32;
        }

        .btn-back:hover {
            background-color: #e8f5e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge" id="status-badge">Início</span>
        <h1 id="main-title">Palmeira Didática</h1>
        
        <div class="content-box" id="text-content">
            Bem-vindo ao nosso espaço de aprendizado. Clique nos botões abaixo para explorar as informações sobre o projeto!
        </div>
        
        <div class="btn-group">
            <button class="btn btn-main" onclick="mostrarConteudo()">Explorar Conteúdo</button>
            <button class="btn btn-main" onclick="mostrarSobre()">Sobre o Projeto</button>
            <!-- Terceiro botão adicionado aqui -->
            <button class="btn btn-back" onclick="mostrarInicio()">Voltar ao Início</button>
        </div>
    </div>

    <script>
        // Função para voltar ao texto original
        function mostrarInicio() {
            document.getElementById('status-badge').innerText = 'Início';
            document.getElementById('main-title').innerText = 'Palmeira Didática';
            document.getElementById('text-content').innerHTML = 'Bem-vindo ao nosso espaço de aprendizado. Clique nos botões abaixo para explorar as informações sobre o projeto!';
        }

        function mostrarConteudo() {
            document.getElementById('status-badge').innerText = 'Conteúdo';
            document.getElementById('main-title').innerText = 'Espécies de Palmeiras';
            document.getElementById('text-content').innerHTML = 'As palmeiras pertencem à família Arecaceae. Elas são plantas tropicais fundamentais para o ecossistema, servindo de abrigo e alimento para diversas espécies de aves e insetos.';
        }

        function mostrarSobre() {
            document.getElementById('status-badge').innerText = 'Sobre';
            document.getElementById('main-title').innerText = 'O Projeto Didático';
            document.getElementById('text-content').innerHTML = 'Este site foi criado com objetivos educacionais para facilitar o estudo da botânica de forma simples, interativa e totalmente aberta para estudantes.';
        }
    </script>

</body>
</html>
