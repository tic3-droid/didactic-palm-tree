<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmeira Didática</title>
    <style>
        /* Estilos visuais do site */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f5; /* Fundo cinza bem claro, quase branco */
            color: #2c3e50; /* Cor do texto cinza escuro */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff; /* Caixa branca de fundo */
            padding: 40px;
            border-radius: 12px; /* Bordas arredondadas */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Sombra suave */
            text-align: center;
            max-width: 500px;
            border-top: 8px solid #2e7d32; /* Barra verde bonita no topo (tema palmeira) */
        }

        h1 {
            color: #2e7d32; /* Título em verde floresta */
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
        }

        .badge {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Projeto Online</span>
        <h1>Palmeira Didática</h1>
        <p>Bem-vindo ao nosso espaço de aprendizado. Em breve, você encontrará aqui um conteúdo completo, interativo e didático sobre as palmeiras.</p>
    </div>

</body>
</html>
